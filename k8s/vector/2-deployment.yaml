apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
  namespace: canister
  labels:
    app: com.tale.canister.vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: com.tale.canister.vector
  template:
    metadata:
      labels:
        app: com.tale.canister.vector
    spec:
      containers:
        - name: vector
          image: timberio/vector:0.39.0-distroless-libc
          args:
            - --config
            - /etc/vector/vector.toml
          ports:
            - name: ingest
              containerPort: 8687
            - name: api
              containerPort: 8686
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: vector-kv
            items:
              - key: VECTOR_CONFIG
                path: vector.toml
