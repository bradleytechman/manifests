apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-html
  namespace: canister
data:
  index.html: |
    <!doctype html>
    <html>
      <head>
        <title>Canister API</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
      </head>
      <body>
        <div id="app"></div>
        <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
        <script>
          (async () => {
            const upstream = 'https://api.canister.me/v2/openapi.json';
            const r = await fetch('https://proxy.scalar.com/?scalar_url=' + encodeURIComponent(upstream));
            const spec = await r.json();
            spec.info.title = 'Canister API';
            spec.info.description = 'Public REST API for the Canister jailbreak package index.';
            Scalar.createApiReference('#app', {
              theme: 'deepSpace',
              proxyUrl: 'https://proxy.scalar.com',
              content: spec,
            });
          })();
        </script>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs
  namespace: canister
  labels:
    app: com.tale.canister.docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: com.tale.canister.docs
  template:
    metadata:
      labels:
        app: com.tale.canister.docs
    spec:
      containers:
        - name: docs
          image: nginxinc/nginx-unprivileged:alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: html
          configMap:
            name: docs-html
