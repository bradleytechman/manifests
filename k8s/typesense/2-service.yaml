# Headless service used by the StatefulSet for stable pod DNS.
apiVersion: v1
kind: Service
metadata:
  name: typesense
  namespace: canister
  labels:
    app: com.tale.canister.typesense
spec:
  clusterIP: None
  selector:
    app: com.tale.canister.typesense
  ports:
    - name: http
      port: 8108
      targetPort: 8108
